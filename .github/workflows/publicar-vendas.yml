name: Publicar pagina de vendas

# Publica a pagina de vendas automaticamente no sabado 15/08 as 23h00 (Brasilia),
# fazendo merge da branch feat/jornada-12-semanas na main.
# O contador da propria pagina abre o carrinho no domingo 16/08 as 15h00.
# Tambem pode ser disparado manualmente na aba Actions (workflow_dispatch).

on:
  schedule:
    - cron: '0 2 16 8 *' # 16/08 02:00 UTC = 15/08 23:00 em Brasilia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge da branch de vendas e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/feat/jornada-12-semanas
          git push origin main

      # Autolimpeza: se falhar, nao afeta a publicacao (ja feita acima).
      # Sem ela, o cron so dispararia de novo em 16/08/2027, e o merge
      # repetido seria "Already up to date" (inofensivo).
      - name: Remover este workflow (publicacao e unica)
        continue-on-error: true
        run: |
          git rm .github/workflows/publicar-vendas.yml
          git commit -m "chore: remove workflow de publicacao agendada (ja executado)"
          git push origin main
