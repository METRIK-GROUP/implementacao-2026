name: Virar para o preco cheio

# Virada de preço da Implementação Ed.8.
#
# Domingo 18/10 às 23h59 (Brasília) acaba o desconto do evento (12x de R$ 390 ou
# R$ 3.997 no PIX). À 0h de 19/10 entra o valor cheio (12x de R$ 490 ou R$ 4.997 no
# PIX), com os checkouts da oferta cheia. Decisão do Rodrigo em 14/10/2026.
#
# A troca na tela quem faz é o script da própria página, na hora exata, no
# relógio de quem está olhando. Este robô grava a troca no HTML
# (scripts/virar-preco-cheio.mjs), regenera as variantes e republica a página
# inicial, para que o repositório, o Google e quem não roda JavaScript vejam o
# valor cheio também.
#
# O agendamento do GitHub atrasa (em agosto rodou 56 min depois da hora). Não
# tem problema: a página já virou sozinha. Se na segunda-feira de manhã o
# vendas.html ainda estiver com data-href-cheio, dispare à mão na aba Actions
# (Run workflow). Depois de rodar, o próprio workflow se apaga.
#
# Só roda a partir da main: o pull request com a virada precisa estar mergeado
# antes de domingo 23h59, senão o cron não encontra este arquivo.

on:
  schedule:
    - cron: '0 3 19 10 *' # 19/10 03:00 UTC = 19/10 00:00 em Brasília (desconto até 18/10 23h59)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-variantes
  cancel-in-progress: false

jobs:
  virar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gravar o valor cheio no vendas.html
        run: node scripts/virar-preco-cheio.mjs

      - name: Regenerar as variantes
        run: node scripts/build.mjs

      - name: Republicar a página inicial, se ela já for a página de vendas
        run: |
          if grep -q 'id="pr-actions"' index.html; then
            cp vendas.html index.html
            echo "index.html atualizado com o valor cheio."
          else
            echo "::warning::index.html ainda não é a página de vendas (o robô 'Publicar pagina de vendas' não rodou?). Só o vendas.html foi virado."
          fi

      - name: Conferir o resultado
        run: |
          grep -q 'pr-pix-val fm">R\$ 4.997<' vendas.html || { echo "::error::vendas.html não ficou com R\$ 4.997 no PIX."; exit 1; }
          grep -q 'pr-val">490<' vendas.html || { echo "::error::vendas.html não ficou com 12x de R\$ 490."; exit 1; }
          if grep -q 'data-href-cheio=' vendas.html index.html; then echo "::error::Ainda há virada programada no HTML."; exit 1; fi
          if grep -q 'DESCONTO EVENTO\|pr-urg' vendas.html index.html; then echo "::error::Ainda há aviso do desconto de domingo no HTML."; exit 1; fi
          if grep -q '2x3ccx7lhp4q23up\|M4E188885X5\|bid=1774198329832' vendas.html index.html; then echo "::error::Ainda há checkout do evento no HTML."; exit 1; fi
          if grep -q 'pr-pix-val fm">R\$ 4.997<\|aqx4edxpcwhpble7\|AE83033554V\|off=i6fqs2yb' upgrade/index.html; then echo "::error::O valor cheio vazou para a página de upgrade."; exit 1; fi

      - name: Remover este workflow (a virada é única)
        run: git rm -q .github/workflows/virar-preco-cheio.yml

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: valor cheio da Implementação (12x de R\$ 490 ou R\$ 4.997 no PIX) a partir de 19/10 à 0h (desconto até 18/10 às 23h59)"
          git push origin main
