name: Gerar variantes do site

# Por que existe: entre 25/06 e 23/09/2026 o vendas.html recebeu 77 commits que
# nunca chegaram na página de alunos, porque ela era editada à mão.
#
# O robô regenera as variantes a partir do vendas.html e:
#   - se nada mudou, termina em silêncio;
#   - se mudou, tenta commitar a correção;
#   - se não tiver permissão para commitar, falha avisando o que ficou para trás.
#
# A escrita para Actions foi liberada na organização METRIK-GROUP em 23/09/2026 e
# a correção automática foi verificada de ponta a ponta no mesmo dia. O terceiro
# caso continua no script porque a configuração é da organização e pode ser
# revertida sem que ninguém aqui perceba — se isso acontecer, o workflow volta a
# se comportar como alarme em vez de falhar sem explicação.

on:
  push:
    branches: [main]
    paths:
      - 'vendas.html'
      - 'scripts/**'
      - '.github/workflows/build-variantes.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-variantes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar variantes a partir de vendas.html
        run: node scripts/build.mjs

      - name: Publicar a correção (ou avisar, se não puder)
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -z "$(git status --porcelain lista-de-espera upgrade)" ]; then
            echo "Variantes em dia com o vendas.html."
            exit 0
          fi

          echo "As variantes estavam atrasadas. Arquivos afetados:"
          git status --porcelain lista-de-espera upgrade

          # Em pull request não dá para commitar no branch de origem; aqui o
          # papel é só avisar que o merge levaria páginas desatualizadas.
          if [ "$EVENTO" = "pull_request" ]; then
            echo "::error::As variantes estão atrasadas. Rode 'node scripts/build.mjs' e faça commit."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lista-de-espera upgrade
          git commit -m "chore: regenera variantes a partir de vendas.html"

          if git push; then
            echo "Variantes regeneradas e publicadas automaticamente."
            exit 0
          fi

          echo "::error::As variantes estão atrasadas e o robô não tem permissão para corrigir."
          echo ""
          echo "Para o robô corrigir sozinho daqui em diante:"
          echo "  Settings da organização METRIK-GROUP -> Actions -> General"
          echo "  -> Workflow permissions -> marcar 'Read and write permissions'"
          echo ""
          echo "Para resolver agora, no computador onde o site é editado:"
          echo "  node scripts/build.mjs"
          echo "  git add lista-de-espera upgrade && git commit && git push"
          echo ""
          echo "Para nunca mais precisar fazer isso à mão, uma vez só:"
          echo "  git config core.hooksPath .githooks"
          exit 1
