# O GitHub Pages publica, por padrão, todo arquivo do repositório — inclusive os
# que existem só para gerar o site. Em 23/09/2026 estavam acessíveis pela web:
# os scripts de build, este README e o código da função de verificação.
#
# Nenhum deles contém senha (as credenciais vivem em variáveis de ambiente do
# Supabase), mas publicar a mecânica da página de upgrade não serve a ninguém:
# expõe os links de checkout da condição de aluno.
#
# `exclude` mantém os arquivos no repositório e fora do site publicado.

exclude:
  # vendas.html é a FONTE das outras páginas, não uma página do site. Até
  # 23/09/2026 ele ficava acessível em /vendas.html, com a oferta cheia e os
  # três checkouts ativos — ou seja, dá para comprar por R$ 3.997 com as
  # inscrições fechadas, bastando digitar o endereço.
  #
  # Quando as inscrições reabrirem, a página de vendas volta pela raiz do site
  # (hoje a raiz redireciona para /lista-de-espera/). Esta linha não atrapalha
  # isso: ela só impede que o arquivo-fonte seja servido diretamente.
  - vendas.html
  - scripts
  - supabase
  - .githooks
  - .gitattributes
  - README.md
